<body>

        <div class="star star-md" style="top: 8%;  left: 50%;">✦</div>
        <div class="star star-lg" style="top: 18%; right: 12%;">✦</div>
        <div class="star star-sm" style="top: 45%; right: 7%;">✦</div>
        <div class="star star-md" style="top: 65%; left: 15%;">✦</div>

        <div class="portfolio-card">
            <nav class="nav-links">
                <a href="#about"    class="pink   spa-link active-nav" data-page="about">About</a>
                <a href="#designs"  class="blue   spa-link"            data-page="designs">Projects</a>
                <a href="#exp"      class="green  spa-link"            data-page="exp">Experience</a>

            </nav>
            <div id="card-content"></div>
        </div>

        <div class="footer-region">
            <div class="social-bar">
                <a href="https://github.com/MinahilImran836" target="_blank"><img src="Assets/github.svg" alt="GitHub" class="social-icon-img"></a>
                <a href="https://www.linkedin.com/in/minahil-imran-29ab72291/" target="_blank"><img src="Assets/linkedin.svg" alt="LinkedIn" class="social-icon-img"></a>
            </div>
            <div class="ground-bar">
                <img src="Assets/F1.png" id="runner-sprite" class="runner-character" alt="Runner">
                <div class="combo-text" id="combo-popup">+1 Skill</div>
                <div class="skills-stream-wrapper">
                    <div class="skills-stream" id="skills-stream"></div>

            </div>
        </div>

    <script>
        /* ── RUN IN PLACE ANIMATION ── */
        const runnerSprite = document.getElementById('runner-sprite');
        let currentFrame = 1;
        if (runnerSprite) {
            setInterval(() => {
                currentFrame = currentFrame === 1 ? 2 : 1;
                runnerSprite.src = `Assets/F${currentFrame}.png`;
            }, 160);
        }

        /* ── SVG-BASED SKILL STREAM ── */
        const skillList = [
            { name: "Figma", icon: "Assets/Figma.svg" },
            { name: "Canva", icon: "Assets/Canva.svg" },
            { name: "React", icon: "Assets/React.svg" },
            { name: "Python", icon: "Assets/Python.svg" },
            { name: "HTML", icon: "Assets/html.svg" },
            { name: "C++", icon: "Assets/cpp.svg" },
            { name: "JavaScript", icon: "Assets/javascript.svg" },
            { name: "Android", icon: "Assets/android.svg" }
        ];

        const streamContainer = document.getElementById('skills-stream');
        const comboPopup = document.getElementById('combo-popup');

        let streamPosition = 0;
        let isWaveActive = false;
        const speed = 3.8;

        function createWave() {
            if (!streamContainer) return;
            streamContainer.innerHTML = '';

            skillList.forEach(skill => {
                const badge = document.createElement('span');
                badge.className = 'runner-skill-badge';
                badge.dataset.skill = skill.name;

                const img = document.createElement('img');
                img.src = skill.icon;
                img.alt = skill.name;

                badge.appendChild(img);
                streamContainer.appendChild(badge);
            });

            const wrapperWidth = document.querySelector('.skills-stream-wrapper').offsetWidth;
            streamPosition = wrapperWidth;
            streamContainer.style.transform = `translate(${streamPosition}px, -50%)`;
            isWaveActive = true;
        }

        function animateSkills() {
            if (isWaveActive) {
                streamPosition -= speed;
                streamContainer.style.transform = `translate(${streamPosition}px, -50%)`;

                const runnerRect = runnerSprite.getBoundingClientRect();
                const badges = streamContainer.querySelectorAll('.runner-skill-badge');
                let remainingBadges = 0;

                badges.forEach(badge => {
                    const badgeRect = badge.getBoundingClientRect();

                    if (badgeRect.left <= runnerRect.right - 20 && !badge.dataset.hit) {
                        badge.dataset.hit = "true";
                        badge.classList.add('hit-fade');

                        comboPopup.textContent = `+1 Skill`;
                        comboPopup.classList.remove('combo-active');
                        void comboPopup.offsetWidth;
                        comboPopup.classList.add('combo-active');
                    }

                    if (!badge.dataset.hit) {
                        remainingBadges++;
                    }
                });

                if (remainingBadges === 0 && isWaveActive) {
                    isWaveActive = false;
                    setTimeout(() => {
                        createWave();
                    }, 800);
                }
            }
            requestAnimationFrame(animateSkills);
        }

        createWave();
        requestAnimationFrame(animateSkills);

        /* ── TYPING ── */
        let introTyped = false;
        function typeLine(elId, text, speed) {
            const el = document.getElementById(elId);
            if (!el) return;
            el.textContent = '';
            let i = 0;
            function next() {
                if (i < text.length) {
                    el.textContent += text[i++];
                    setTimeout(next, speed);
                }
            }
            next();
        }

        /* ── PAGE TEMPLATES ── */
        const pages = {
            about: {
                title: 'Portfolio | Minahil Imran',
                render() {
                    return `
                    <div class="card-scroll-area">
                        <div class="about-layout">
                            <div class="about-avatar-col">
                                <div class="circle-frame">
                                    <div class="avatar-inner" id="face">
                                        <img src="Assets/head.png" class="head-base" alt="Avatar">
                                        <div class="eye-socket left"><img src="Assets/eye-ball.png" class="pupil" alt="Pupil"></div>
                                        <div class="eye-socket right"><img src="Assets/eye-ball.png" class="pupil" alt="Pupil"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="about-text-col">
                                <div class="intro-name">Minahil Imran</div>
                                <div class="intro-role">Software Engineer</div>
                                <p class="intro-text" id="intro-para"></p>

                    
                            </div>
                        </div>
                    </div>`;
                },
                afterRender() {
                    const face   = document.getElementById('face');
                    const pupils = document.querySelectorAll('.pupil');

                    if (face) {
                        function eyeMove(e) {
                            if (!document.getElementById('face')) {
                                document.removeEventListener('mousemove', eyeMove);
                                return;
                            }

                            if (window.innerWidth <= 768) {
                                pupils.forEach(p => {
                                    p.style.transform = `translate(-50%, -50%)`;
                                });
                                return;
                            }

                            const rect = face.getBoundingClientRect();
                            const cx = rect.left + rect.width  / 2;
                            const cy = rect.top  + rect.height / 2;
                            const angle = Math.atan2(e.clientY - cy, e.clientX - cx);

                            pupils.forEach(p => {
                                p.style.transform = `translate(calc(-50% + ${Math.cos(angle) * 3}px), calc(-50% + ${Math.sin(angle) * 2}px))`;
                            });
                        }

                        if (window.innerWidth <= 768) {
                            pupils.forEach(p => {
                                p.style.transform = `translate(-50%, -50%)`;
                            });
                        }

                        document.addEventListener('mousemove', eyeMove);
                    }

                    const bioText = "Designing backends, AI systems, and intuitive interfaces. Bridging complex backend engineering with clean code and thoughtful product design.";
                    const el = document.getElementById('intro-para');
                    if (!el) return;
                    if (introTyped) {
                        el.textContent = bioText;
                    } else {
                        introTyped = true;
                        typeLine('intro-para', bioText, 22);
                    }
                }
            },
            designs: {
                title: 'Projects | Minahil Imran',
                render() {
                    return `
                    <div class="card-scroll-area">
                        <h2 class="section-heading">Projects</h2>
                        <div class="designs-grid">
                            <a href="#detail?project=emailassistant" class="grid-design-card spa-link" data-page="detail" data-project="emailassistant">
                                <div class="grid-card-thumb"><img src="Assets/email.png" alt="Email Assistant"></div>
                                <div class="grid-card-body">
                                    <div class="grid-card-title">Email Assistant</div>
                                    <div class="grid-card-desc">AI email management system with Groq LLM thread summarization & OAuth integrations.</div>
                                </div>
                            </a>
                            <a href="#detail?project=styletransfer" class="grid-design-card spa-link" data-page="detail" data-project="styletransfer">
                                <div class="grid-card-thumb"><img src="Assets/NST.png" alt="Style Transfer"></div>
                                <div class="grid-card-body">
                                    <div class="grid-card-title">Fast NST Tuning</div>
                                    <div class="grid-card-desc">Deep learning experiments fine-tuning a Fast Neural Style Transfer model on Flickr30k using perceptual metrics.</div>
                                </div>
                            </a>
                            <a href="#detail?project=cirrhosis" class="grid-design-card spa-link" data-page="detail" data-project="cirrhosis">
                                <div class="grid-card-thumb"><img src="Assets/cirrhosis.png" alt="Cirrhosis CV"></div>
                                <div class="grid-card-body">
                                    <div class="grid-card-title">Cirrhosis Diagnosis</div>
                                    <div class="grid-card-desc">Multi-task CV system combining classification, detection, and lesion segmentation for liver diagnosis.</div>
                                </div>
                            </a>
                            <a href="#detail?project=fetch" class="grid-design-card spa-link" data-page="detail" data-project="fetch">
                                <div class="grid-card-thumb"><img src="Assets/fetch.png" alt="Fetch"></div>
                                <div class="grid-card-body">
                                    <div class="grid-card-title">Fetch</div>
                                    <div class="grid-card-desc">AI-powered assistant unifying Drive, Classroom, Calendar, and local notes using RAG context retrieval.</div>
                                </div>
                            </a>
                            <a href="#detail?project=campuslife" class="grid-design-card spa-link" data-page="detail" data-project="campuslife">
                                <div class="grid-card-thumb"><img src="Assets/campusLife.png" alt="Campus Life"></div>
                                <div class="grid-card-body">
                                    <div class="grid-card-title">Campus Life</div>
                                    <div class="grid-card-desc">Android app with Room database, Firebase community hub, and local RAG search over academic notes.</div>
                                </div>
                            </a>
                            <a href="#detail?project=quill" class="grid-design-card spa-link" data-page="detail" data-project="quill">
                                <div class="grid-card-thumb"><img src="Assets/quill.png" alt="Quill"></div>
                                <div class="grid-card-body">
                                    <div class="grid-card-title">Quill</div>
                                    <div class="grid-card-desc">Cross-platform digital journaling app replicating real notebook interaction with custom canvas math.</div>
                                </div>
                            </a>
                        </div>
                    </div>`;
                },
                afterRender() {}
            },
            exp: {
                title: 'Experience | Minahil Imran',
                render() {
                    return `
                    <div class="card-scroll-area">
                        <h2 class="section-heading">Experience</h2>
                        <div class="exp-block">
                            <div class="exp-role-title">Artificial Intelligence Engineer</div>
                            <div class="exp-company">Upwork · Aug 2025 – Feb 2026 (7 mos)</div>
                            <div class="exp-desc">
                                • Architected and deployed custom AI solutions and production pipelines for international clients.<br>
                                • Integrated large language models (LLMs) and retrieval-augmented generation (RAG) workflows into existing business backend architectures.<br>
                                • Optimized client data processing pipelines for improved system responsiveness and lower latency.<br>
                                • Collaborated directly with stakeholders to translate business requirements into clean, scalable software implementations.
                            </div>
                        </div>
                        <div class="exp-divider"></div>
                    </div>`;
                },
                afterRender() {}
            },
            contact: {
                title: 'Contact | Minahil Imran',
                render() {
                    return `
                    <div class="card-scroll-area">
                        <h2 class="section-heading">Contact Me</h2>
                        <div class="contact-info-row"><span>✉</span> minahilimran836@gmail.com</div>
                        <div class="contact-form-wrap">
                            <div class="contact-field">
                                <label for="c-name">Name</label>
                                <input type="text" id="c-name" placeholder="Your name">
                            </div>
                            <div class="contact-field">
                                <label for="c-msg">Message</label>
                                <textarea id="c-msg" rows="4" placeholder="Say hello..."></textarea>
                            </div>
                            <button class="contact-submit-btn" onclick="sendMessage()">Send ✦</button>
                        </div>
                    </div>`;
                },
                afterRender() {}
            },
            detail: {
                title: 'Project Detail | Minahil Imran',
                render() {
                    return `
                    <div class="card-scroll-area">
                        <a href="#designs" class="detail-back-btn spa-link" data-page="designs">← Back to Projects</a>
                        <div class="detail-meta">
                            <div class="detail-title" id="detail-title">Loading…</div>
                            <div class="detail-tags" id="detail-tags"></div>
                        </div>
                        <p class="detail-description" id="detail-desc"></p>
                        <div class="detail-section-title">Screens & Demos</div>
                        <div class="detail-screens-grid" id="detail-screens"></div>
                        <div class="detail-section-title">Engineering & Design Notes</div>
                        <p class="detail-description" id="detail-notes"></p>
                    </div>`;
                },
                afterRender(project) {
                    const projects = {
                        emailassistant: {
                            title: 'AI Email Assistant', 
                            tags: ['Python', 'Groq API', 'Gmail/Outlook APIs', 'LLM Summarization'],
                            desc: 'Unified multi-platform email automation system with LLM-powered thread summarization and calendar scheduling.',
                            screens: ['Assets/email1.png', 'Assets/email2.png'],
                            notes: 'Engineered backend polling loops and OAuth2 integrations for Gmail & Microsoft Graph APIs, routing raw MIME data into structured JSON for Groq LLM inference.'
                        },
                        styletransfer: {
                            title: 'Fast Neural Style Transfer Fine-Tuning', 
                            tags: ['PyTorch', 'VGG-16', 'Perceptual Loss', 'Research Paper'],
                            desc: 'Conducted deep learning experiments fine-tuning a Fast Neural Style Transfer model on Flickr30k.',
                            screens: ['Assets/NST1.png', 'Assets/NST2.png'],
                            notes: 'Co-authored technical research paper analyzing content vs. style weight ratios in Neural Style Transfer. Evaluated structural retention vs artistic transformation using SSIM (0.3–0.4) and LPIPS (~0.5) metrics.'
                        },
                        cirrhosis: {
                            title: 'Cirrhosis Medical CV Pipeline', 
                            tags: ['PyTorch', 'Computer Vision', 'Segmentation', 'Medical AI'],
                            desc: 'Diagnostic multi-model system for classification, lesion segmentation, and detection in liver imaging.',
                            screens: ['Assets/cirrhosis1.png', 'Assets/cirrhosis2.png'],
                            notes: 'Trained and evaluated multi-task neural network architectures on medical datasets. Optimized segmentation Dice scores through targeted loss functions and image preprocessing.'
                        },
                        fetch: {
                            title: 'Fetch', 
                            tags: ['RAG Pipeline', 'Figma', 'Mobile UX', 'Google APIs'],
                            desc: 'Built an AI-powered personal assistant that unifies notes, Google Drive, Google Classroom assignments, and Google Calendar. Features a custom themed interface with local RAG search over personal notes and assignment deadlines.',
                            screens: ['Assets/Fetch1.jpg', 'Assets/Fetch2.jpg', 'Assets/Fetch3.jpg', 'Assets/Fetch4.jpg'],
                            notes: 'Designed mobile touch interfaces integrated with semantic retrieval backends to ensure high visual clarity for AI-generated answers.'
                        },
                        campuslife: {
                            title: 'Campus Life AI Companion', 
                            tags: ['Kotlin', 'Android', 'Room DB', 'Firebase', 'RAG'],
                            desc: 'Student productivity application leveraging Retrieval-Augmented Generation (RAG) over local notes, integrated with Room Database and Firebase community note sharing.',
                            screens: ['Assets/CampusLife1_cropped.jpg', 'Assets/CampusLife2_cropped.jpg', 'Assets/CampusLife3_cropped.jpg', 'Assets/CampusLife4_cropped.jpg'],
                            notes: 'Implemented MVC architecture using Room DB and Kotlin Coroutines/Flow for non-blocking local storage, paired with Firebase for cloud-based note distribution.'
                        },
                        quill: {
                            title: 'Quill App', 
                            tags: ['Flutter', 'Dart', 'Custom UI Math', 'Mobile App'],
                            desc: 'Personalized digital journaling application designed to replicate the tactile experience of a physical notebook with page-turn interaction and sticker positioning.',
                            screens: ['Assets/Quill1_cropped.jpg', 'Assets/Quill2_cropped.jpg', 'Assets/Quill3_cropped.jpg', 'Assets/Quill4_cropped.jpg'],
                            notes: 'Developed in Flutter/Dart, optimizing custom canvas layout math to allow dynamic sticker positioning and touch-responsive page flipping.'
                        }
                    };

                    const data = projects[project];
                    if (!data) return;
                    document.title = data.title + ' | Minahil Imran';
                    document.getElementById('detail-title').textContent = data.title;
                    const tagsEl = document.getElementById('detail-tags');
                    tagsEl.innerHTML = '';
                    data.tags.forEach(t => {
                        const s = document.createElement('span');
                        s.className = 'detail-tag';
                        s.textContent = t;
                        tagsEl.appendChild(s);
                    });
                    document.getElementById('detail-desc').textContent  = data.desc;
                    document.getElementById('detail-notes').textContent = data.notes;

                    const grid = document.getElementById('detail-screens');
                    if (!grid) return;
                    grid.innerHTML = '';

                    grid.className = 'detail-screens-grid ' + (data.screens.length > 2 ? 'grid-4-items' : 'grid-2-items');

                    data.screens.forEach((src, i) => {
                        const div = document.createElement('div');
                        div.className = 'detail-screen-thumb';
                        const img = document.createElement('img');
                        img.src = src;
                        img.alt = data.title + ' Screen ' + (i + 1);
                        div.appendChild(img);
                        grid.appendChild(div);
                    });
                }
            }
        };

        /* ── ROUTER ── */
        function getRoute() {
            const hash = location.hash.replace('#', '') || 'about';
            if (hash.startsWith('detail?project=')) {
                return { page: 'detail', project: hash.split('=')[1] };
            }
            return { page: hash, project: null };
        }

        function navigate(route) {
            const { page, project } = route;
            const def     = pages[page] || pages.about;
            const content = document.getElementById('card-content');

            content.classList.add('fading');
            setTimeout(() => {
                document.title        = def.title;
                content.innerHTML    = def.render(project);

                document.querySelectorAll('.nav-links .spa-link').forEach(a => {
                    a.classList.toggle('active-nav',
                        a.dataset.page === page || (page === 'detail' && a.dataset.page === 'designs'));
                });

                bindLinks();
                def.afterRender(project);
                content.classList.remove('fading');
            }, 180);
        }

        function bindLinks() {
            document.querySelectorAll('.spa-link').forEach(a => {
                if (a.dataset.bound) return;
                a.dataset.bound = '1';
                a.addEventListener('click', e => {
                    e.preventDefault();
                    const page    = a.dataset.page    || 'about';
                    const project = a.dataset.project || null;
                    history.pushState(null, '', '#' + (project ? `detail?project=${project}` : page));
                    navigate({ page, project });
                });
            });
        }

        window.addEventListener('popstate', () => navigate(getRoute()));
        bindLinks();
        navigate(getRoute());

        /* ── CONTACT ── */
        function sendMessage() {
            const name = (document.getElementById('c-name') || {}).value || '';
            const msg  = encodeURIComponent((document.getElementById('c-msg') || {}).value || '');
            const to   = 'minahilimran836@gmail.com';
            const subj = encodeURIComponent('Portfolio Inquiry from ' + name);
            window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subj}&body=${msg}`, '_blank');
        }

        /* ── RESUME DOWNLOAD ── */
        function downloadResume() {
            alert('Add your resume PDF to the Assets folder to link it here.');
        }
    </script>
</body>
</html>
